<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100" role="img" aria-labelledby="title desc">
  <title id="title">TLFM</title>
  <desc id="desc">TLFM Energy and Training logo mark without the small tagline</desc>

  <!-- Transparent background. The logo scales cleanly at any size. -->
  <g transform="translate(8 10)">
    <!-- Sun rays -->
    <g fill="#F2B000">
      <rect x="25" y="0" width="8" height="17" rx="4"/>
      <rect x="25" y="63" width="8" height="17" rx="4"/>
      <rect x="0" y="35" width="17" height="8" rx="4"/>
      <rect x="63" y="35" width="17" height="8" rx="4"/>
      <rect x="7" y="7" width="8" height="17" rx="4" transform="rotate(-45 11 15.5)"/>
      <rect x="57" y="56" width="8" height="17" rx="4" transform="rotate(-45 61 64.5)"/>
      <rect x="57" y="7" width="8" height="17" rx="4" transform="rotate(45 61 15.5)"/>
      <rect x="7" y="56" width="8" height="17" rx="4" transform="rotate(45 11 64.5)"/>
    </g>

    <!-- Sun -->
    <circle cx="29" cy="39" r="25" fill="#F2B000"/>
  </g>

  <!-- Main wordmark -->
  <text x="94" y="70"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="800"
        letter-spacing="-3"
        fill="#172335">TLFM</text>
</svg>
